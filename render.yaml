## ─────────────────────────────────────────────────────
##  Render Blueprint – Digital Fabrication Network
##  Docs: https://docs.render.com/blueprint-spec
## ─────────────────────────────────────────────────────

services:
  # ── Backend API (Express + TypeScript) ──────────────
  - type: web
    name: dfn-backend
    runtime: node
    region: oregon
    plan: free # Switch to "starter" or "standard" for production
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      # ── Core ────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000" # Render assigns port via PORT env var; 10000 is the default

      # ── Database (auto-wired from managed Postgres) ─
      - key: DATABASE_URL
        fromDatabase:
          name: dfn-database
          property: connectionString
      - key: DB_SSL
        value: "true"

      # ── Redis (auto-wired from managed Redis) ───────
      - key: REDIS_URL
        fromService:
          name: dfn-redis
          type: redis
          property: connectionString

      # ── Auth ────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Set manually in Render dashboard (your Vercel URL)

      # ── Google OAuth ────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false # e.g. https://dfn-backend.onrender.com/api/auth/google/callback

      # ── Google Places ───────────────────────────────
      - key: GOOGLE_PLACES_API_KEY
        sync: false

      # ── Email / SMTP ────────────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # ── S3-Compatible Storage ───────────────────────
      - key: USE_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_FORCE_PATH_STYLE
        sync: false

      # ── Payment Providers ───────────────────────────
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false

