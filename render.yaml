## ─────────────────────────────────────────────────────
##  Render Blueprint – Digital Fabrication Network
##  Docs: https://docs.render.com/blueprint-spec
## ─────────────────────────────────────────────────────

services:
  # ── Backend API (Express + TypeScript) ──────────────
  - type: web
    name: dfn-backend
    runtime: node
    region: oregon
    plan: free  # Switch to "starter" ($7/mo) to prevent spin-down in production
    buildCommand: corepack enable && pnpm install && pnpm build:backend
    startCommand: pnpm start:backend
    healthCheckPath: /health
    envVars:
      # ── Core ────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

      # ── Database (Neon Serverless PostgreSQL) ───────
      - key: DATABASE_URL
        sync: false  # e.g. postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/neondb?sslmode=require
      - key: DB_SSL
        value: "true"

      # ── Cache & Pub/Sub (Upstash Redis) ─────────────
      - key: REDIS_URL
        sync: false  # e.g. rediss://default:xxx@xxx.upstash.io:6379

      # ── S3 / MinIO Object Storage ───────────────────
      - key: USE_S3
        value: "true"
      - key: AWS_FORCE_PATH_STYLE
        value: "true"  # Required for MinIO path-style URLs
      - key: AWS_REGION
        value: "us-east-1"
      - key: AWS_S3_BUCKET
        value: "dfn-uploads"
      - key: AWS_ENDPOINT
        sync: false  # e.g. https://minio.yourdomain.com or https://dfn-minio.onrender.com
      - key: AWS_ACCESS_KEY_ID
        sync: false  # MinIO access key / root user
      - key: AWS_SECRET_ACCESS_KEY
        sync: false  # MinIO secret key / root password

      # ── Auth ────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # Your Vercel frontend URL, e.g. https://dfn.vercel.app

      # ── Google OAuth ────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false  # e.g. https://dfn-backend.onrender.com/api/auth/google/callback

      # ── Google Places ───────────────────────────────
      - key: GOOGLE_PLACES_API_KEY
        sync: false

      # ── Email / SMTP ────────────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # ── Payment Providers ───────────────────────────
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false

  # ── (Optional) Self-Hosted MinIO on Render ───────────
  # If you want Render to host MinIO with a persistent disk,
  # uncomment the service below. Note that Render Disks require
  # a paid instance type (Starter plan: $7/mo + $0.25/GB/mo).
  # If using external MinIO / Cloudflare R2 / AWS S3, leave this commented.
  #
  # - type: web
  #   name: dfn-minio
  #   runtime: image
  #   image:
  #     url: minio/minio:latest
  #   region: oregon
  #   plan: starter
  #   disk:
  #     name: minio-data
  #     mountPath: /data
  #     sizeGB: 10
  #   startCommand: server /data --address :10000 --console-address :10001
  #   healthCheckPath: /minio/health/live
  #   envVars:
  #     - key: MINIO_ROOT_USER
  #       sync: false
  #     - key: MINIO_ROOT_PASSWORD
  #       sync: false
  #     - key: PORT
  #       value: "10000"
